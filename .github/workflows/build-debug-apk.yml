name: Bunny Evolution Android validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - bunny-evolution-dev
    paths:
      - 'app/**'
      - 'core/**'
      - 'external/**'
      - 'shared/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle*'
      - 'build.gradle*'
      - '.gitmodules'
      - '.github/workflows/build-debug-apk.yml'

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: sdkmanager --install 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Run unit tests
        run: .\\gradlew.bat testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: .\\gradlew.bat assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bunny-evolution-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
